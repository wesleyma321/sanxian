name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: sanxian

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip python3-dev python3-setuptools build-essential git \
          openjdk-17-jdk-headless unzip wget

    - name: Install Python packages
      run: |
        pip3 install --user buildozer==1.5.0 kivy==2.3.0
        pip3 install --user cython==0.29.33

    - name: Set JAVA_HOME
      run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: Build APK
      working-directory: sanxian
      run: |
        ~/.local/bin/buildozer android debug
        cp sanxian/bin/*.apk ../sanxian.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sanxian-apk
        path: sanxian.apk