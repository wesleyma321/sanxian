name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: sanxian

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y python3-pip python3-dev python3-setuptools build-essential git openjdk-17-jdk-headless

    - name: Install Python packages
      run: |
        pip3 install --user buildozer==1.5.0 kivy==2.3.0 cython==0.29.33

    - name: Build APK
      working-directory: sanxian
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        ~/.local/bin/buildozer android debug 2>&1 | tee build.log || true

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: sanxian/build.log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: sanxian-apk
        path: sanxian/bin/*.apk
