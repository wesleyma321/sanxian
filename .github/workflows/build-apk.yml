name: Build Android APK                                                                                               
                                                                                                                      
on:                                                                                                                   
  push:                                                                                                               
    branches: [main]                                                                                                  
  workflow_dispatch:                                                                                                  
                                                                                                                      
jobs:                                                                                                                 
  build:                                                                                                              
    runs-on: ubuntu-latest                                                                                            
                                                                                                                      
    steps:                                                                                                            
    - name: Checkout code                                                                                             
      uses: actions/checkout@v4                                                                                       
      with:                                                                                                           
        path: sanxian                                                                                                 
                                                                                                                      
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip python3-dev python3-setuptools build-essential git openjdk-17-jdk-headless unzip wget
          openjdk-17-jdk-headless unzip wget                                                                          
                                                                                                                      
    - name: Install Python packages                                                                                   
      run: |                                                                                                          
        pip3 install --user buildozer==1.5.0 kivy==2.3.0                                                              
        pip3 install --user cython==0.29.33                                                                           
                                                                                                                      
    - name: Set JAVA_HOME                                                                                             
      run: echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV                                          
                                                                                                                      
    - name: Pre-setup Android SDK                                                                                     
      run: |                                                                                                          
        export ANDROID_HOME=~/.buildozer/android/platform/android-sdk                                                 
        mkdir -p $ANDROID_HOME                                                                                        
        cd $ANDROID_HOME                                                                                              
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip                                                                                                     
        unzip -q cmdline-tools.zip                                                                                    
        mkdir -p cmdline-tools/latest                                                                                 
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true                                                  
        rm cmdline-tools.zip                                                                                          
        mkdir -p tools/bin                                                                                            
        ln -sf ../cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager 2>/dev/null || true                        
                                                                                                                      
    - name: Accept licenses and install SDK components                                                                
      run: |                                                                                                          
        export ANDROID_HOME=~/.buildozer/android/platform/android-sdk                                                 
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH                         
        yes | sdkmanager --licenses 2>/dev/null || true                                                               
        sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools" 2>&1 | tail -20             
                                                                                                                      
    - name: Build APK                                                                                                 
      working-directory: sanxian                                                                                      
      run: |                                                                                                          
        ~/.local/bin/buildozer android debug --verbose 2>&1 | tail -100                                               
                                                                                                                      
    - name: Upload APK                                                                                                
      if: success()                                                                                                   
      uses: actions/upload-artifact@v4                                                                                
      with:                                                                                                           
        name: sanxian-apk                                                                                             
        path: sanxian/bin/*.apk                                                                                       
                                                                                                                      
    - name: Show build logs on failure                                                                                
      if: failure()                                                                                                   
      run: |                                                                                                          
        cat sanxian/.buildozer/logs/*.log || echo "No buildozer logs found"                                           
