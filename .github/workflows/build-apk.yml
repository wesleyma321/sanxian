name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: sanxian

    - name: Install system packages
      run: |
        sudo apt update
        sudo apt install -y python3-pip python3-dev python3-setuptools build-essential git openjdk-17-jdk-headless unzip wget

    - name: Install Python packages
      run: |
        pip3 install --user buildozer==1.5.0 kivy==2.3.0
        pip3 install --user cython==0.29.33

    - name: Accept SDK licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Build APK
      working-directory: sanxian
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      run: |
        ~/.local/bin/buildozer android debug 2>&1

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: sanxian-apk
        path: sanxian/bin/*.apk
