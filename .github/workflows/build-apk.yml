name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: sanxian

    - name: Install system packages
      run: |
        sudo apt update
        sudo apt install -y python3-pip python3-dev python3-setuptools build-essential git openjdk-17-jdk-headless unzip wget

    - name: Install Python packages
      run: |
        pip3 install --user buildozer==1.5.0 kivy==2.3.0
        pip3 install --user cython==0.29.33

    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

    - name: Accept Android SDK licenses
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        yes | /usr/local/lib/android/sdk/tools/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Setup symlinks for buildozer
      run: |
        mkdir -p ~/.buildozer/android/platform
        ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

    - name: Build APK
      working-directory: sanxian
      run: |
        ~/.local/bin/buildozer android debug 2>&1 | tee build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: sanxian-apk
        path: sanxian/bin/*.apk

    - name: Show build logs on failure
      if: failure()
      run: |
        cat sanxian/build.log || cat ~/.buildozer/logs/*.log || echo "No logs found"                                     
