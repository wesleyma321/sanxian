name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: sanxian

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip python3-dev python3-setuptools build-essential git \
          openjdk-17-jdk-headless unzip wget

    - name: Install Python packages
      run: |
        pip3 install --user buildozer==1.5.0 kivy==2.3.0
        pip3 install --user cython==0.29.33

    - name: Set JAVA_HOME
      run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: Accept Android SDK licenses
      run: |
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

    - name: Build APK
      working-directory: sanxian
      run: |
        ~/.local/bin/buildozer android debug --verbose 2>&1 | tail -100

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: sanxian-apk
        path: sanxian/bin/*.apk

    - name: Show build logs on failure
      if: failure()
      run: |
        cat sanxian/.buildozer/logs/*.log || echo "No buildozer logs found"